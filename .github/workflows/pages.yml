name: Demo web (GitHub Pages)

# Compila o 2048 (C++17 + SDL2) para WebAssembly e publica a pasta web/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fontes DejaVu (embutidas no WebAssembly)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0

      - name: Compilar para WebAssembly
        run: make web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
